name: release.docker.edge-connect

# Builds and publishes the three doublezero-edge-connect variants to GHCR.
# See docs/superpowers/specs/2026-06-12-edge-connect-image-variants-design.md.
#   push to main      -> moving tags (:testnet, :mainnet-beta = :latest, devnet :latest) + :sha-
#   workflow_dispatch -> the same, on main only; with a version X.Y.Z, plus pinned
#                        :<env>-X.Y.Z (devnet :X.Y.Z)
#   pull_request      -> build-only smoke test (mainnet-beta, no push)
# Releases are dispatched on main, never triggered by a tag, so every publish builds
# a commit that reached main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - .github/workflows/release.docker.edge-connect.build.yml
      - .github/workflows/release.docker.edge-connect.yml
      - .github/workflows/release.docker.edge-connect.poll.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z (blank = moving tags only)"
        required: false
        default: ""
        type: string

# Least-privilege default; the publish/smoke jobs widen this per job as needed.
permissions:
  contents: read

jobs:
  # Validate the release version once: the dispatch's version input, or empty for
  # every other run (which then publishes moving tags only).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::only main publishes: dispatch this workflow from main"
            exit 1
          fi
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ $semver ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-prerelease"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Push to main, or a dispatch on main: build and push all three variants.
  publish:
    needs: version
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        env: [testnet, mainnet-beta, devnet]
    uses: $/.github/workflows/release.docker.edge-connect.build.yml
    with:
      env: ${{ matrix.env }}
      push: true
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  # PR smoke test: build mainnet-beta only, no push. All variants share the same
  # Rust source and differ only in base image, so one no-push build catches
  # Dockerfile/layering regressions cheaply.
  smoke:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: $/.github/workflows/release.docker.edge-connect.build.yml
    with:
      env: mainnet-beta
      push: false
      ref: ${{ github.sha }}
