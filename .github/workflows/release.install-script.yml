name: release.install-script

# Publishes scripts/connect*.sh and the shred-proxy installer to the CDN behind
# https://get.doublezero.xyz/connect (and /connect-testnet, /connect-devnet, /shred-proxy).
# Auth is GitHub OIDC into a role that trusts only this workflow on main, under this
# repo's custom OIDC subject template. Infra: malbeclabs/infra's install-script-hosting.md.
#
# The feed-registry document under the feeds/ keys of the same bucket is published by
# malbeclabs/infra's feed-registry aggregator — a different artifact with its own publisher,
# not another key to add here.
on:
  push:
    branches: [main]
    paths:
      - "scripts/connect.sh"
      - "scripts/connect-testnet.sh"
      - "scripts/connect-devnet.sh"
      - "shred-proxy/packaging/install.sh"
      - ".github/workflows/release.install-script.yml"
  workflow_dispatch:

permissions: {}

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE: arn:aws:iam::967501763874:role/github-get-doublezero-edge-connect
  BUCKET: doublezero-install-967501763874
  DISTRIBUTION_ID: E3RHVENYEH05TJ

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # assume the AWS deploy role via OIDC
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload connect scripts
        run: |
          for variant in "connect:connect.sh" "connect-testnet:connect-testnet.sh" "connect-devnet:connect-devnet.sh"; do
            key="${variant%%:*}"; file="scripts/${variant##*:}"
            aws s3 cp "$file" "s3://${BUCKET}/${key}" \
              --content-type text/x-shellscript \
              --cache-control "public,max-age=120"
          done

      # The standalone shred-proxy installer is served under the same bucket at
      # https://get.doublezero.xyz/shred-proxy. It downloads the prebuilt binary published by
      # release.shred-proxy.yml, so it is decoupled from the Docker-image release cadence.
      - name: Upload shred-proxy installer
        run: |
          aws s3 cp shred-proxy/packaging/install.sh "s3://${BUCKET}/shred-proxy" \
            --content-type text/x-shellscript \
            --cache-control "public,max-age=120"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/connect' '/connect-testnet' '/connect-devnet' '/shred-proxy'
