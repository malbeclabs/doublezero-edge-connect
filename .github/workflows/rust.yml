name: rust

# Build, lint, and test the Rust crate on every PR and on pushes to main/hotfix branches.
# Mirrors the build-control jobs in malbeclabs/doublezero (.github/workflows/rust.yml),
# adapted for this single-crate project: no Solana/agave tooling or validator job, and the
# `make` targets are inlined as direct cargo commands.
on:
  push:
    branches: [main, 'hotfix/**']
  pull_request:

# Least-privilege default: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain selects the toolchain from the @ref (a branch); pinned to a
      # SHA we must name the toolchain explicitly via `toolchain:`.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `--workspace` is required: this is a root-package workspace (root `Cargo.toml` has both
      # `[package]` and `[workspace]`), so a bare `cargo build` selects only the root crate and would
      # never compile the `shred-proxy` member.
      # `--locked` mirrors the Dockerfile's `cargo build --release --locked`, which until now was
      # the only place the lock was enforced: CI re-resolved silently, so a `Cargo.lock` Cargo would
      # have to rewrite passed here and first surfaced days later as a failed GHCR publish — see
      # issue #155, where two independently-resolved Dependabot locks merged into exactly that state
      # and stalled the image publishes for three days.
      # Both flags apply to clippy/test below too.
      - run: cargo build --workspace --release --locked --verbose

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # Nightly is only needed for rustfmt's imports_granularity option (matches the
      # reference repo's `cargo +nightly fmt` formatting contract).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo +nightly fmt --all -- --check --config imports_granularity=Crate
      # The nightly toolchain above is now the default, but clippy is only installed on
      # stable — pin clippy to stable so it doesn't resolve to the (clippy-less) nightly.
      - name: clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -Dclippy::all -Dwarnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features --locked --verbose

  # Every other job runs on Linux; this one keeps the workspace compiling on macOS.
  rust-check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked
