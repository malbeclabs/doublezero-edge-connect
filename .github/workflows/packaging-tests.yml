name: packaging-tests

# Runs tests/packaging.bats, which pins the CLI package's inertness (Task 4 of
# docs/design/cli-packaging-and-installer-plan.md): it builds a real snapshot .deb/.rpm with
# goreleaser and asserts on the built artifacts (dpkg/rpm/ldd output), not on
# release/.goreleaser.base.edge-cli.yaml, so a dependency or maintainer script arriving through
# any mechanism still fails the build.
#
# goreleaser OSS can't parse the shipped config's two goreleaser-pro-only top-level keys
# (`monorepo:`, `nightly:`); the test builds from a copy with just those deleted (via `yq`), so
# this job needs no GORELEASER_KEY and runs on PRs from forks. Separate from shell-tests.yml
# because it needs a musl + rpm + goreleaser toolchain the connect.sh suite does not.
#
# Runs unconditionally rather than filtering on `paths:` -- see security-audit.yml for why a
# paths-filtered required check gets stuck as "Expected -- Waiting for status to be reported" on
# PRs that don't touch the filtered paths.
on:
  push:
    branches: [main, 'hotfix/**']
  pull_request:

# Least-privilege default: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: |
            target
            target/x86_64-unknown-linux-musl/release

      # bats runs the test; rpm/musl-tools are the same packaging toolchain
      # release.edge-cli.yml installs (musl-tools provides musl-gcc, the static build's
      # linker; rpm is nfpm's rpm-building dependency).
      - name: Install bats, rpm and musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats rpm musl-tools binutils

      # goreleaser OSS (not -pro): the test needs no license, so it runs on every PR including
      # forks. Pinned to the version this test was validated against, and checked against
      # its sha256 so an unverified binary never runs.
      - name: Install goreleaser
        env:
          VERSION: v2.17.1
          # goreleaser_Linux_x86_64.tar.gz from that release's checksums.txt. To upgrade,
          # change both values together.
          SHA256: a99bbc7ae0d8d897b07c4c497a9b62f222558804715ef219d1af05a7e417bc80
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/goreleaser"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/goreleaser.tar.gz" \
            "https://github.com/goreleaser/goreleaser/releases/download/$VERSION/goreleaser_Linux_x86_64.tar.gz"
          echo "$SHA256  $dir/goreleaser.tar.gz" | sha256sum -c -
          tar -xzf "$dir/goreleaser.tar.gz" -C "$dir" goreleaser
          echo "$dir" >> "$GITHUB_PATH"

      # SHA256 is yq_linux_amd64's SHA-256 column in that release's `checksums` file.
      - name: Install yq
        env:
          SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          echo "$SHA256  $RUNNER_TEMP/yq" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq

      - name: Run packaging tests
        run: bats tests/packaging.bats
