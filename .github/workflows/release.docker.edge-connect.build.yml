name: release.docker.edge-connect.build

# Reusable build of ONE doublezero-edge-connect environment variant. Called by
# release.docker.edge-connect.yml (releases / main / dispatch),
# release.docker.edge-connect.dispatch.yml (base published) and
# release.docker.edge-connect.poll.yml (base poll). They call it through `$/`,
# which actionlint does not resolve, so check them by hand when an input changes.
# Each variant layers the same edge-connect binary on the matching doublezero base
# image; only the base differs across testnet / mainnet-beta / devnet. Keeping the
# base/tag logic here is what keeps publish and poll from drifting.
on:
  workflow_call:
    inputs:
      env:
        description: "Variant: testnet | mainnet-beta | devnet"
        required: true
        type: string
      push:
        description: "Push to GHCR (false = build-only smoke test)"
        required: false
        default: false
        type: boolean
      version:
        description: "edge-connect release version (e.g. 0.1.0); blank = moving tags only"
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref/sha to build from"
        required: false
        default: ""
        type: string

# No top-level permissions: this is a workflow_call-only workflow, so it inherits the
# GITHUB_TOKEN permissions the caller job grants (publish/rebuild -> packages:write,
# smoke -> packages:read). Declaring a block here would INTERSECT with the caller and
# can only narrow it: `contents: read` silently stripped the packages:write the push
# needs (GHCR denied), and adding packages:write made smoke request more than its
# caller grants, failing the run at startup. Inheriting is the only correct option.
jobs:
  build:
    runs-on: ubuntu-latest
    # Only main publishes, whichever workflow called us.
    if: ${{ !inputs.push || github.ref == 'refs/heads/main' }}
    # Serialize everything that pushes one variant's tags, whichever workflow called
    # us: the publish matrix (push to main, manual dispatch, versioned release), the
    # base-published dispatch and the poll's rebuild all write the same moving tag
    # (:testnet, :mainnet-beta, devnet :latest), which ends up wherever the LAST push
    # points rather than at the newest commit. On 2026-09-11 two main pushes three
    # minutes apart inverted exactly that way: the older commit's testnet build
    # finished ten minutes after the newer one and left :testnet on the older image.
    # The lane belongs here, in the one job that pushes — a group per calling
    # workflow only serializes that workflow against itself, which is what the
    # dispatch's own group used to do.
    #
    # Two lanes, and the dividing line is whether the build pushes at all:
    #   push=true   -> one lane per variant. EVERY publisher of a variant shares it,
    #                  versioned releases included, because a release build writes the
    #                  moving tag beside its pinned :<env>-X.Y.Z. A lane it did not
    #                  share would let it run alongside a main push and leave the
    #                  moving tag on whichever finished last — which is the bug this
    #                  whole change exists to remove, reintroduced one lane over.
    #   push=false  -> per-run lane. A PR smoke build pushes nothing, so it must
    #                  neither wait behind a publish nor sit in a publisher's queue.
    #
    # `queue: max` is what makes the single lane safe, and is the reason a release
    # does not need a lane of its own: by default a group holds one run in progress
    # and ONE pending, and a newly queued run cancels that pending one — so a release
    # publish waiting behind a build could be evicted by a later push to main and
    # silently never publish its pinned tags. With queue: max up to 100 runs wait,
    # first-in-first-out by when each reached the lane, so nothing is dropped and the
    # moving tag ends up wherever the last arrival points. It is incompatible with
    # cancel-in-progress: true, which is not wanted here anyway.
    concurrency:
      group: >-
        ${{ inputs.push
        && format('edge-connect-publish-{0}', inputs.env)
        || format('edge-connect-smoke-{0}-{1}', inputs.env, github.run_id) }}
      # Let an in-flight build finish rather than abort a push mid-flight.
      cancel-in-progress: false
      # Not known to actionlint v1.7.12 (March 2026) — the key shipped in May 2026 —
      # so .github/actionlint.yaml ignores that one message until a release knows it.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The actually-built commit (inputs.ref may be a branch name); used for the
      # :sha- tag and BUILD_COMMIT so they match what was compiled.
      - name: Resolve build sha
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Map the variant to target image, base image, moving tag, whether it
      # owns :latest, and the Cloudsmith repo its doublezero client is installed
      # from (empty = keep the base image's client). Single source of truth,
      # shared with the poll workflow.
      - name: Resolve variant config
        id: cfg
        shell: bash
        env:
          VARIANT: ${{ inputs.env }}
        run: |
          owner='${{ github.repository_owner }}'
          case "$VARIANT" in
            testnet)
              image="ghcr.io/${owner}/doublezero-edge-connect"
              base="ghcr.io/${owner}/doublezero:testnet"
              client_repo="doublezero-testnet"
              moving="testnet"; latest="false" ;;
            mainnet-beta)
              image="ghcr.io/${owner}/doublezero-edge-connect"
              base="ghcr.io/${owner}/doublezero:mainnet-beta"
              client_repo=""
              moving="mainnet-beta"; latest="true" ;;
            devnet)
              image="ghcr.io/${owner}/doublezero-edge-connect-devnet"
              base="ghcr.io/${owner}/doublezero-devnet:latest"
              client_repo=""
              moving="latest"; latest="false" ;;
            *)
              echo "unknown env '$VARIANT'"; exit 1 ;;
          esac
          {
            echo "image=$image"
            echo "base=$base"
            echo "moving=$moving"
            echo "latest=$latest"
            echo "client_repo=$client_repo"
          } >> "$GITHUB_OUTPUT"

      # docker/login-action is not on the org's action allowlist.
      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Resolve the base to an immutable digest: reproducible builds + the digest
      # we record in the image label for the poll to compare against.
      - name: Resolve base digest
        id: base
        shell: bash
        env:
          BASE: ${{ steps.cfg.outputs.base }}
        run: |
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$BASE")"
          [ -n "$digest" ] || { echo "could not resolve digest for $BASE"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Base $BASE -> $digest"

      # Pin the exact client deb the variant installs, so the build is
      # reproducible and the poll can compare it against the repo's latest
      # (recorded as the io.doublezero.client.version label). Resolved inside the
      # pinned base, which already carries that repo's apt list, so the candidate
      # comes from the same distro and codename the Dockerfile installs into.
      - name: Resolve client version
        id: client
        if: steps.cfg.outputs.client_repo != ''
        shell: bash
        env:
          PINNED_BASE: ${{ steps.cfg.outputs.base }}@${{ steps.base.outputs.digest }}
          CLIENT_REPO: ${{ steps.cfg.outputs.client_repo }}
        run: |
          version="$(docker run --rm --entrypoint bash "$PINNED_BASE" -c '
            set -e
            apt-get update -qq >/dev/null
            apt-cache policy doublezero | awk "/Candidate:/ {print \$2}"')"
          case "$version" in ""|"(none)") echo "could not resolve doublezero in $CLIENT_REPO"; exit 1 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Client $CLIENT_REPO -> doublezero=$version"

      # Tag list: always moving + sha-<short>, plus :latest for the variant that
      # owns it — on every build, not only a release, because :latest is
      # documented as the same image as :mainnet-beta. Moved only on a release, it
      # sat on a June build that rejects the hosted feed registry (#186). On a
      # release (version set) add the pinned tag too. devnet uses a bare
      # :<version> (its moving tag is already :latest).
      - name: Compute tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ steps.cfg.outputs.image }}
          MOVING: ${{ steps.cfg.outputs.moving }}
          LATEST: ${{ steps.cfg.outputs.latest }}
          SHA: ${{ steps.sha.outputs.sha }}
          VERSION: ${{ inputs.version }}
          VARIANT: ${{ inputs.env }}
        run: |
          short="${SHA:0:12}"
          tags="${IMAGE}:${MOVING}"$'\n'"${IMAGE}:sha-${short}"
          if [ "$LATEST" = 'true' ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          if [ -n "$VERSION" ]; then
            safe="$(printf '%s' "$VERSION" | tr '~:' '--')"
            if [ "$VARIANT" = 'devnet' ]; then
              pinned="${IMAGE}:${safe}"
            else
              pinned="${IMAGE}:${MOVING}-${safe}"
            fi
            # A version names one commit: refuse to move it, but let a re-run of that commit through.
            if published="$(docker buildx imagetools inspect --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' "$pinned" 2>/dev/null)" \
              && [ "$published" != "$SHA" ]; then
              echo "::error::$pinned is already published from ${published:-another commit}"
              exit 1
            fi
            tags="${tags}"$'\n'"${pinned}"
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Tags:"; printf '%s\n' "$tags"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ inputs.push }}
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          # A pushed image never restores layers from the Actions cache.
          no-cache: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DZ_BASE_IMAGE=${{ steps.cfg.outputs.base }}@${{ steps.base.outputs.digest }}
            DZ_BASE_DIGEST=${{ steps.base.outputs.digest }}
            BUILD_VERSION=${{ inputs.version != '' && inputs.version || steps.sha.outputs.sha }}
            BUILD_COMMIT=${{ steps.sha.outputs.sha }}
            DZ_CLIENT_REPO=${{ steps.cfg.outputs.client_repo }}
            DZ_CLIENT_VERSION=${{ steps.client.outputs.version }}
