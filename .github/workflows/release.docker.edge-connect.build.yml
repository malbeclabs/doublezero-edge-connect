name: release.docker.edge-connect.build

# Reusable build of ONE doublezero-edge-connect environment variant. Called by
# release.docker.edge-connect.yml (releases / main / dispatch) and
# release.docker.edge-connect.poll.yml (base poll).
# Each variant layers the same edge-connect binary on the matching doublezero base
# image; only the base differs across testnet / mainnet-beta / devnet. Keeping the
# base/tag logic here is what keeps publish and poll from drifting.
on:
  workflow_call:
    inputs:
      env:
        description: "Variant: testnet | mainnet-beta | devnet"
        required: true
        type: string
      push:
        description: "Push to GHCR (false = build-only smoke test)"
        required: false
        default: false
        type: boolean
      version:
        description: "edge-connect release version (e.g. 0.1.0); blank = moving tags only"
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref/sha to build from"
        required: false
        default: ""
        type: string

# No top-level permissions: this is a workflow_call-only workflow, so it inherits the
# GITHUB_TOKEN permissions the caller job grants (publish/rebuild -> packages:write,
# smoke -> packages:read). Declaring a block here would INTERSECT with the caller and
# can only narrow it: `contents: read` silently stripped the packages:write the push
# needs (GHCR denied), and adding packages:write made smoke request more than its
# caller grants, failing the run at startup. Inheriting is the only correct option.
jobs:
  build:
    runs-on: ubuntu-latest
    # Serialize everything that pushes one variant's tags, whichever workflow called
    # us: the publish matrix (push to main, manual dispatch, release tag), the
    # base-published dispatch and the poll's rebuild all write the same moving tag
    # (:testnet, :mainnet-beta, devnet :latest), which ends up wherever the LAST push
    # points rather than at the newest commit. On 2026-09-11 two main pushes three
    # minutes apart inverted exactly that way: the older commit's testnet build
    # finished ten minutes after the newer one and left :testnet on the older image.
    # The lane belongs here, in the one job that pushes — a group per calling
    # workflow only serializes that workflow against itself, which is what the
    # dispatch's own group used to do.
    #
    # Two lanes, and the dividing line is whether the build pushes at all:
    #   push=true   -> one lane per variant. EVERY publisher of a variant shares it,
    #                  release tags included, because a release build writes the
    #                  moving tag beside its pinned :<env>-X.Y.Z. A lane it did not
    #                  share would let it run alongside a main push and leave the
    #                  moving tag on whichever finished last — which is the bug this
    #                  whole change exists to remove, reintroduced one lane over.
    #   push=false  -> per-run lane. A PR smoke build pushes nothing, so it must
    #                  neither wait behind a publish nor sit in a publisher's queue.
    #
    # `queue: max` is what makes the single lane safe, and is the reason a release
    # does not need a lane of its own: by default a group holds one run in progress
    # and ONE pending, and a newly queued run cancels that pending one — so a release
    # publish waiting behind a build could be evicted by a later push to main and
    # silently never publish its pinned tags. With queue: max up to 100 runs wait,
    # first-in-first-out by when each reached the lane, so nothing is dropped and the
    # moving tag ends up wherever the last arrival points. It is incompatible with
    # cancel-in-progress: true, which is not wanted here anyway.
    #
    # What this still does not promise: a release tag cut on a commit that is not
    # main's HEAD publishes the moving tag for that older commit, and FIFO will
    # honour it because arrival order is all the lane knows. Ordering by commit
    # would take a check against the tag's current revision label, which is worth
    # doing the day we tag anything but HEAD.
    concurrency:
      group: >-
        ${{ inputs.push
        && format('edge-connect-publish-{0}', inputs.env)
        || format('edge-connect-smoke-{0}-{1}', inputs.env, github.run_id) }}
      # Let an in-flight build finish rather than abort a push mid-flight.
      cancel-in-progress: false
      # Not known to actionlint v1.7.12 (March 2026) — the key shipped in May 2026 —
      # so .github/actionlint.yaml ignores that one message until a release knows it.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The actually-built commit (inputs.ref may be a branch name); used for the
      # :sha- tag and BUILD_COMMIT so they match what was compiled.
      - name: Resolve build sha
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Map the variant to target image, base image, moving tag, and whether it
      # owns :latest. Single source of truth, shared with the poll workflow.
      - name: Resolve variant config
        id: cfg
        shell: bash
        run: |
          owner='${{ github.repository_owner }}'
          case '${{ inputs.env }}' in
            testnet)
              image="ghcr.io/${owner}/doublezero-edge-connect"
              base="ghcr.io/${owner}/doublezero:testnet"
              moving="testnet"; latest="false" ;;
            mainnet-beta)
              image="ghcr.io/${owner}/doublezero-edge-connect"
              base="ghcr.io/${owner}/doublezero:mainnet-beta"
              moving="mainnet-beta"; latest="true" ;;
            devnet)
              image="ghcr.io/${owner}/doublezero-edge-connect-devnet"
              base="ghcr.io/${owner}/doublezero-devnet:latest"
              moving="latest"; latest="false" ;;
            *)
              echo "unknown env '${{ inputs.env }}'"; exit 1 ;;
          esac
          {
            echo "image=$image"
            echo "base=$base"
            echo "moving=$moving"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Resolve the base to an immutable digest: reproducible builds + the digest
      # we record in the image label for the poll to compare against.
      - name: Resolve base digest
        id: base
        shell: bash
        run: |
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' '${{ steps.cfg.outputs.base }}')"
          [ -n "$digest" ] || { echo "could not resolve digest for ${{ steps.cfg.outputs.base }}"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Base ${{ steps.cfg.outputs.base }} -> $digest"

      # Tag list: always moving + sha-<short>. On a release (version set) add the
      # pinned tag, and :latest for the variant that owns it. devnet uses a bare
      # :<version> (its moving tag is already :latest).
      - name: Compute tags
        id: tags
        shell: bash
        run: |
          image='${{ steps.cfg.outputs.image }}'
          moving='${{ steps.cfg.outputs.moving }}'
          sha='${{ steps.sha.outputs.sha }}'
          short="${sha:0:12}"
          tags="${image}:${moving}"$'\n'"${image}:sha-${short}"
          ver='${{ inputs.version }}'
          if [ -n "$ver" ]; then
            safe="$(printf '%s' "$ver" | tr '~:' '--')"
            if [ '${{ inputs.env }}' = 'devnet' ]; then
              tags="${tags}"$'\n'"${image}:${safe}"
            else
              tags="${tags}"$'\n'"${image}:${moving}-${safe}"
              if [ '${{ steps.cfg.outputs.latest }}' = 'true' ]; then
                tags="${tags}"$'\n'"${image}:latest"
              fi
            fi
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Tags:"; printf '%s\n' "$tags"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ inputs.push }}
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DZ_BASE_IMAGE=${{ steps.cfg.outputs.base }}@${{ steps.base.outputs.digest }}
            DZ_BASE_DIGEST=${{ steps.base.outputs.digest }}
            BUILD_VERSION=${{ inputs.version != '' && inputs.version || steps.sha.outputs.sha }}
            BUILD_COMMIT=${{ steps.sha.outputs.sha }}
