name: security-audit

# Supply-chain audit of the Cargo dependency tree via cargo-deny: known RUSTSEC
# advisories, disallowed/duplicate crates, license policy, and source allow-listing
# (config in deny.toml). The weekly schedule catches newly-disclosed CVEs even when
# no code changes land.
#
# cargo-deny is a required status check, so the pull_request trigger runs
# unconditionally: a `paths`-filtered required check is skipped (never reported) on
# PRs that don't touch the dependency files, leaving the PR stuck on
# "Expected — Waiting for status to be reported". The push trigger keeps its paths
# filter since it only feeds the weekly/main signal, not a merge gate.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The release binary, checked against its published sha256 so an unverified binary
      # never runs. To upgrade, change both values together.
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cargo-deny"
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $dir/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf "$dir/cargo-deny.tar.gz" -C "$dir" --strip-components=1 "$name/cargo-deny"
          echo "$dir" >> "$GITHUB_PATH"
      # The same invocation EmbarkStudios/cargo-deny-action ran, with its defaults spelled out.
      - name: cargo deny
        run: cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check advisories bans licenses sources
